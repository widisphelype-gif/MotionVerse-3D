name: Build MotionVerse for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows executables
        run: npm run package:win
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: MotionVerse-Body-Outline-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
